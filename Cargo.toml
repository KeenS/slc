[workspace]
resolver = "3"
members = [
    "crates/slc-core",
    "crates/slc-syntax",
    "crates/slc-fmt",
    "crates/slc-check",
    "crates/slc-runtime",
    "crates/slc-abi",
    "crates/slc-driver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
