[workspace]
resolver = "3"
members = [
    "crates/slc-core",
    "crates/slc-syntax",
    "crates/slc-fmt",
    "crates/slc-check",
    "crates/slc-runtime",
    "crates/slc-abi",
    "crates/slc-rt",
    "crates/slc-driver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1

# Package overrides cannot set panic; it has to match the whole crate graph.
# The staticlib test builds this profile. Workspace release stays unwind.
[profile.release-abort]
inherits = "release"
panic = "abort"
